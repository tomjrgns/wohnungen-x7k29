const ROWS = DATA.rows;
const HAT_CASHFLOW = DATA.cashflow;
const EUR = new Intl.NumberFormat("de-DE", {style: "currency", currency: "EUR", maximumFractionDigits: 0});
const EUR2 = new Intl.NumberFormat("de-DE", {style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2});
const NUM = new Intl.NumberFormat("de-DE", {maximumFractionDigits: 1});
const PCT = new Intl.NumberFormat("de-DE", {style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1});
const ZUSTAND = {renovierungsbeduerftig: "renovierungsbedürftig", sanierungsbeduerftig: "sanierungsbedürftig"};

function esc(s){return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function kpi(label, wert, klasse){
  if (wert === null || wert === undefined) return "";
  return `<div class="kpi"><div class="l">${label}</div><div class="v ${klasse || ""}">${wert}</div></div>`;
}
function card(r){
  const tags = [];
  if (r.baujahr) tags.push("Baujahr " + r.baujahr);
  if (r.modernisiert) tags.push("modernisiert " + r.modernisiert);
  if (r.zustand) tags.push(ZUSTAND[r.zustand] || r.zustand);
  if (r.zimmer) tags.push(NUM.format(r.zimmer) + " Zimmer");
  if (r.etage) tags.push(r.etage);
  if (r.balkon) tags.push("Balkon");
  if (r.kueche) tags.push("Einbauküche");
  if (r.aufzug) tags.push("Aufzug");
  if (r.stellplatz) tags.push("Stellplatz");
  if (r.moebliert) tags.push("möbliert");
  if (r.vermietet) tags.push("vermietet");
  if (r.hausgeld) tags.push("Hausgeld " + EUR.format(r.hausgeld));
  let html = tags.map(t => `<span class="tag">${esc(t)}</span>`).join("");
  if (r.sicherheit) {
    const ab = r.abdeckung != null ? ` · Datenabdeckung ${Math.round(r.abdeckung * 100)} %` : "";
    html += `<span class="tag ${esc(r.sicherheit)}">Mietschätzung: Sicherheit ${esc(r.sicherheit)}${ab}</span>`;
  }
  const cf = r.cashflow;
  const kpis = kpi("Kaufpreis", EUR.format(r.preis))
    + kpi("Fläche", r.qm != null ? NUM.format(r.qm) + " m²" : null)
    + kpi("Preis pro m²", r.preis_qm != null ? EUR.format(r.preis_qm) : null)
    + kpi("Min. Kaltmiete", r.min_miete_qm != null ? EUR2.format(r.min_miete_qm) + " / m²" : null)
    + kpi("Rendite (Min.-Miete)", r.rendite_min != null ? PCT.format(r.rendite_min) : null, r.rendite_min != null ? "good" : "")
    + kpi("Kaltmiete (KI)", r.miete != null ? EUR.format(r.miete) + " / Monat" : null)
    + kpi("Rendite (KI-Miete)", r.rendite_ki != null ? PCT.format(r.rendite_ki) : null)
    + (HAT_CASHFLOW ? kpi("Cashflow", cf != null ? EUR.format(cf) + " / Monat" : null, cf != null ? (cf >= 0 ? "good" : "bad") : "") : "");
  let extra = "";
  if (r.begruendung || r.faktoren) {
    extra = `<details><summary>Wie kommt die KI-Mietschätzung zustande?</summary>`
      + (r.miete_qm != null ? `<p>Geschätzt: ${EUR2.format(r.miete_qm)} pro m²</p>` : "")
      + (r.begruendung ? `<p>${esc(r.begruendung)}</p>` : "")
      + (r.faktoren ? `<p>Zu- und Abschläge: ${esc(r.faktoren)}</p>` : "")
      + `</details>`;
  }
  return `<article class="card"><div class="rang">#${r.rang}</div><div class="main">
    <h2>${esc(r.titel)}</h2><div class="ort">${esc(r.ort)}</div>
    <div class="kpis">${kpis}</div><div class="tags">${html}</div>${extra}
    <a class="btn" href="${esc(r.link)}" target="_blank" rel="noopener">Zum Inserat</a></div></article>`;
}

const LOW = -1e12, HIGH = 1e12;
const SORT = {
  rang: (a, b) => a.rang - b.rang,
  rendite_min: (a, b) => (b.rendite_min ?? LOW) - (a.rendite_min ?? LOW),
  rendite_ki: (a, b) => (b.rendite_ki ?? LOW) - (a.rendite_ki ?? LOW),
  cashflow: (a, b) => (b.cashflow ?? LOW) - (a.cashflow ?? LOW),
  preis: (a, b) => a.preis - b.preis,
  preis_qm: (a, b) => (a.preis_qm ?? HIGH) - (b.preis_qm ?? HIGH),
};

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const stadt = document.getElementById("stadt").value;
  const sort = document.getElementById("sort").value;
  const pos = document.getElementById("pos").checked;
  let rows = ROWS.filter(r =>
    (!q || (r.titel + " " + r.ort).toLowerCase().includes(q)) &&
    (!stadt || r.stadt === stadt) &&
    (!pos || (r.cashflow != null && r.cashflow >= 0)));
  rows = rows.slice().sort(SORT[sort]);
  document.getElementById("count").textContent = rows.length + " von " + ROWS.length + " Wohnungen";
  document.getElementById("list").innerHTML = rows.length ? rows.map(card).join("") : '<p class="leer">Keine Wohnungen gefunden.</p>';
}

const staedte = [...new Set(ROWS.map(r => r.stadt).filter(Boolean))].sort();
document.getElementById("stadt").innerHTML = '<option value="">Alle Orte</option>' + staedte.map(s => `<option>${esc(s)}</option>`).join("");
if (!HAT_CASHFLOW) {
  document.getElementById("poslabel").style.display = "none";
  document.querySelector('#sort option[value="cashflow"]').remove();
}
for (const id of ["q", "stadt", "sort", "pos"]) document.getElementById(id).addEventListener("input", render);
render();
</script>
